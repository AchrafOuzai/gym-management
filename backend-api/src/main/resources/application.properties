spring.application.name=gym-api

# Database — lit les variables d'environnement Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/gymdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gymuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gympassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION:86400000}

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=Gym Management API
info.app.version=1.0.0

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true