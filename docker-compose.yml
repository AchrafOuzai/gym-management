services:
  db-gym:
    image: mysql:8.0
    container_name: gym_mysql
    environment:
      MYSQL_DATABASE: gymdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: gymuser
      MYSQL_PASSWORD: gympassword
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: