name: GymManager CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gym-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gym-frontend

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build & Test Backend Spring Boot
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend-api
          mvn clean package -DskipTests --no-transfer-progress

      - name: Run Tests
        run: |
          cd backend-api
          mvn test --no-transfer-progress
        continue-on-error: true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend-api/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Build Frontend Angular
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gym-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd gym-frontend
          npm ci

      - name: Build Angular production
        run: |
          cd gym-frontend
          npm run build -- --configuration=production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: gym-frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Build & Push Docker Images vers GitHub Registry
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert owner to lowercase
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image names
        id: images
        run: |
          echo "backend=ghcr.io/${{ steps.owner.outputs.owner }}/gym-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${{ steps.owner.outputs.owner }}/gym-frontend" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./gym-frontend
          file: ./gym-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "##  Pipeline réussi !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Images publiées :" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.images.outputs.backend }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.images.outputs.frontend }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "###  Commit : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY